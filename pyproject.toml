[project]
name = "titlevision-assistant"
version = "0.2.0"
description = "A Windows desktop assistant for reviewed TitleVision ETA updates."
requires-python = ">=3.13,<3.14"
readme = "README.md"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Check repository hygiene and version
        run: python scripts/check_repository.py
      - name: Compile source
        run: python -m compileall -q source tests scripts
      - name: Offline rules and Edge browser tests
        run: python -m unittest discover -s tests -v
      - name: Verify desktop bundle builds
        run: python scripts/build_release.py bundle

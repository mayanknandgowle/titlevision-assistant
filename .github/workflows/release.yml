name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Validate source and release version
        run: python scripts/check_repository.py
      - name: Test before packaging
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python scripts/build_release.py bundle
      - name: Sign application when configured
        if: vars.SIGN_RELEASES == 'true'
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: ./scripts/sign.ps1 -File release/bundle/TitleVisionAssistant/TitleVisionAssistant.exe
      - name: Build installer
        run: python scripts/build_release.py installer
      - name: Sign installer when configured
        if: vars.SIGN_RELEASES == 'true'
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: ./scripts/sign.ps1 -File (Get-ChildItem release/TitleVisionAssistant-Setup-*.exe).FullName
      - name: Package and calculate checksums after signing
        run: python scripts/build_release.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            release/TitleVisionAssistant-Setup-*.exe
            release/TitleVisionAssistant-Portable-*.zip
            release/SHA256SUMS.txt
            release/dependency-inventory.json
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "import runpy; print(runpy.run_path('source/appmeta.py')['VERSION'])"
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.zip','.txt','.json' } | ForEach-Object FullName
          gh release view "v$version" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Inspect it rather than overwriting published assets.' }
          gh release create "v$version" @assets --draft --title "TitleVision Assistant $version" --notes-file docs/RELEASE_NOTES.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
